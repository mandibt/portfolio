name: CI

# One pipeline for every branch and pull request; publishing only happens on main.
#
#   desktop-chromium ─┐
#   desktop-firefox  ─┤
#   desktop-webkit   ─┼─→ report (merge blobs → HTML report + dashboard data) ─→ deploy (main only)
#   mobile-chromium  ─┘
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One browser failing is a result about that browser; keep the others.
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chromium, browser: chromium }
          - { project: desktop-firefox, browser: firefox }
          - { project: desktop-webkit, browser: webkit }
          - { project: mobile-chromium, browser: chromium }
    env:
      # Names the blob file (playwright.config.ts) so the four don't collide.
      PW_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser from cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install system dependencies only (browser came from cache)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run the suite on ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge reports & build dashboard
    needs: test
    # Runs when tests fail too — a red run is exactly when the report matters.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On a push, check out the branch itself (not a detached SHA) so the
          # dashboard data can be committed back to it.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      # One merge, two reporters: Playwright's HTML report (every browser's
      # traces in one place) and the custom dashboard reporter, which writes
      # assets/qa/* and the summary shown on this run's page.
      - name: Merge into the HTML report and the dashboard data
        run: npx playwright merge-reports --reporter html,./reporters/qa-dashboard-reporter.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # Traces and videos travel to the deploy job as an artifact rather than
      # being committed, so the repository doesn't grow by megabytes per run.
      - name: Upload dashboard artifacts (traces, videos)
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: assets/qa/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit dashboard data to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/qa/report.json assets/qa/history.json assets/qa/test-history.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore: update QA dashboard data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy to GitHub Pages
    # needs → only when every browser job and the report job succeeded.
    needs: [test, report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the dashboard data the report job just committed

      - name: Fetch traces and videos
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-artifacts
          path: assets/qa/artifacts

      - name: Assemble the site (dev-only files stay out)
        run: |
          mkdir -p _site
          cp -r index.html cv.html qa-suite.html 404.html assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
