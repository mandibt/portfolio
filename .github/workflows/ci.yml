name: CI

# One pipeline for every branch and pull request; publishing only happens on main.
#
#   desktop-chromium ─┐
#   desktop-firefox  ─┤
#   desktop-webkit   ─┼─→ report (merge blobs → HTML report + dashboard data) ─→ deploy (main only)
#   mobile-chromium  ─┘
#
# Manual runs: Actions → CI → "Run workflow". Pick one browser or all, optionally
# narrow to a tag (@a11y, @smoke, ...), and choose whether a run on main
# publishes. Only a full run (all browsers, no filter) can publish, so the
# dashboard never shows a partial suite as if it were the whole thing.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: Browsers to run
        type: choice
        default: all
        options: [all, desktop-chromium, desktop-firefox, desktop-webkit, mobile-chromium]
      grep:
        description: Only tests matching this tag or regex (e.g. @a11y). Empty runs everything.
        type: string
        default: ""
      publish:
        description: On main, commit the dashboard data and deploy to Pages (full runs only)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One browser failing is a result about that browser; keep the others.
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.projects != 'all' && format('["{0}"]', inputs.projects) || '["desktop-chromium","desktop-firefox","desktop-webkit","mobile-chromium"]') }}
    env:
      # Names the blob file (playwright.config.ts) so the jobs don't collide.
      PW_PROJECT: ${{ matrix.project }}
      BROWSER: ${{ contains(matrix.project, 'firefox') && 'firefox' || (contains(matrix.project, 'webkit') && 'webkit' || 'chromium') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser from cache
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ env.BROWSER }}

      - name: Install ${{ env.BROWSER }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps "$BROWSER"

      - name: Install system dependencies only (browser came from cache)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps "$BROWSER"

      - name: Run the suite on ${{ matrix.project }}
        env:
          GREP: ${{ inputs.grep }}
        run: |
          args=(--project="$PW_PROJECT")
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.project }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge reports & build dashboard
    needs: test
    # Runs when tests fail too — a red run is exactly when the report matters.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.grep == '' && inputs.projects == 'all')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # When publishing, check out the branch itself (not a detached SHA) so
          # the dashboard data can be committed back to it.
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      # One merge, two reporters: Playwright's HTML report (every browser's
      # traces in one place) and the custom dashboard reporter, which writes
      # assets/qa/* and the summary shown on this run's page.
      - name: Merge into the HTML report and the dashboard data
        run: npx playwright merge-reports --reporter html,./reporters/qa-dashboard-reporter.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # Traces and videos travel to the deploy job as an artifact rather than
      # being committed, so the repository doesn't grow by megabytes per run.
      - name: Upload dashboard artifacts (traces, videos)
        uses: actions/upload-artifact@v7
        with:
          name: qa-artifacts
          path: assets/qa/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit dashboard data to main
        if: env.PUBLISH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/qa/report.json assets/qa/history.json assets/qa/test-history.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore: update QA dashboard data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy to GitHub Pages
    # needs → only when every browser job and the report job succeeded.
    needs: [test, report]
    # Same rule as PUBLISH above (job-level `if` can't read env).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.grep == '' && inputs.projects == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # includes the dashboard data the report job just committed

      - name: Fetch traces and videos
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: qa-artifacts
          path: assets/qa/artifacts

      - name: Assemble the site (dev-only files stay out)
        run: |
          mkdir -p _site
          cp -r index.html cv.html qa-suite.html 404.html assets _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
