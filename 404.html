<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // GitHub Pages serves this file for any unknown path, at any depth
    // (/portfolio/a/b/c). Relative asset links would then resolve under
    // /portfolio/a/b/ and the page would render unstyled, so pin the base to
    // the site root first: the repository segment on *.github.io, "/" anywhere
    // else (the local server included). Must run before the links below.
    (function () {
      var segments = location.pathname.split("/").filter(Boolean);
      var root = /\.github\.io$/.test(location.hostname) && segments.length ? "/" + segments[0] + "/" : "/";
      document.write('<base href="' + root + '">');
    })();
  </script>
  <title>Page not found - Stefan Mandovski</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
  <style>
    .notfound { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-block: 60px; }
    .notfound .code { font-family: "Spectral", serif; font-size: 5rem; font-weight: 600; color: var(--accent-ink); line-height: 1; }
    .notfound p { color: var(--ink-soft); margin-top: 14px; max-width: 40ch; }
    .notfound .btn { margin-top: 26px; }
  </style>
</head>
<body>
  <main class="notfound">
    <h1 class="code">404</h1>
    <p>This page wandered off the test plan. It's not where it's supposed to be.</p>
    <a class="btn btn-primary" href="index.html">Back to the portfolio</a>
  </main>
</body>
</html>
